<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cloud Solutions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,.1);
            text-align: center;
            width: 420px;
        }

        h1 {
            color: #0078d4;
        }

        .info {
            margin-top: 25px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Cloud Solutions</h1>

    <p>Aplicação publicada no Azure App Service</p>

    <div class="info">
        <p><strong>Tecnologia:</strong> {{ tecnologia }}</p>
        <p><strong>Ambiente:</strong> {{ ambiente }}</p>
        <p><strong>Versão:</strong> {{ versao }}</p>
    </div>

</div>

</body>
</html>
